<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1130" width="800" height="1130">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="45%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="accentGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>
    <linearGradient id="badgeGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.9" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="1130" fill="url(#bgGrad2)" />

  <!-- Subtle Cyber Grids & Geometric Accents -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <path d="M0,100 H800 M0,200 H800 M0,300 H800 M0,400 H800 M0,500 H800 M0,600 H800 M0,700 H800 M0,800 H800 M0,900 H800 M0,1000 H800" />
    <path d="M100,0 V1130 M200,0 V1130 M300,0 V1130 M400,0 V1130 M500,0 V1130 M600,0 V1130 M700,0 V1130" />
  </g>

  <!-- Glowing Orb / Core Geometric Feature -->
  <circle cx="650" cy="220" r="180" fill="#10b981" opacity="0.12" filter="blur(40px)" />
  <circle cx="150" cy="850" r="220" fill="#10b981" opacity="0.08" filter="blur(60px)" />

  <!-- Outer Luxury Border -->
  <rect x="30" y="30" width="740" height="1070" rx="16" fill="none" stroke="#10b981" stroke-width="2" stroke-opacity="0.4" />
  <rect x="42" y="42" width="716" height="1046" rx="10" fill="none" stroke="#ffffff" stroke-width="0.75" stroke-opacity="0.15" />

  <!-- Top Series Category Header -->
  <g transform="translate(60, 90)">
    <rect x="0" y="0" width="310" height="38" rx="19" fill="url(#badgeGrad2)" />
    <text x="20" y="24" fill="#ffffff" font-family="'Sarabun', 'Noto Sans Thai', sans-serif" font-size="14" font-weight="bold" letter-spacing="1.5">
      COMPUTING SCIENCE MASTER SERIES • VOL. 2
    </text>
  </g>

  <!-- Academic Standard Accreditation -->
  <text x="730" y="115" text-anchor="end" fill="#94a3b8" font-family="'Sarabun', sans-serif" font-size="13" font-weight="500">
    มาตรฐานหลักสูตรวิทยาการคำนวณระดับอุดมศึกษา
  </text>

  <!-- Prominent Volume Badge -->
  <g transform="translate(60, 160)" filter="url(#shadow)">
    <rect x="0" y="0" width="130" height="130" rx="20" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-width="2" />
    <text x="65" y="55" text-anchor="middle" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="16" font-weight="600" letter-spacing="2">VOLUME</text>
    <text x="65" y="108" text-anchor="middle" fill="#ffffff" font-family="'Inter', sans-serif" font-size="52" font-weight="800">02</text>
  </g>

  <!-- Thai Main Title -->
  <g transform="translate(60, 360)">
    <text x="0" y="0" fill="#ffffff" font-family="'Sarabun', 'Noto Sans Thai', sans-serif" font-size="40" font-weight="800" line-height="1.2">
      วิทยาการคำนวณ 2 บล็อกโค้ดดิ้งและการแก้ปัญหาเชิงภาพ
    </text>
  </g>

  <!-- English Prominent Title -->
  <g transform="translate(60, 430)">
    <text x="0" y="0" fill="url(#accentGrad2)" font-family="'Outfit', 'Inter', sans-serif" font-size="28" font-weight="700">
