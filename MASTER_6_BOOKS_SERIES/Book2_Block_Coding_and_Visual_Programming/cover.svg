    </text>
  </g>

  <!-- 10 Chapters Bulleted Preview Box -->
  <g transform="translate(60, 580)">
    <rect x="0" y="0" width="680" height="340" rx="14" fill="#0b1329" fill-opacity="0.75" stroke="#334155" stroke-width="1.5" />
    <text x="24" y="36" fill="#10b981" font-family="'Sarabun', sans-serif" font-size="16" font-weight="bold">
      สาระการเรียนรู้แกนกลาง 10 บทวิชาการ (10 Core Chapters)
    </text>
    <line x1="24" y1="48" x2="656" y2="48" stroke="#334155" stroke-width="1" />
    <circle cx="30" cy="75" r="3" fill="#10b981" />
    <text x="42" y="80" fill="#f1f5f9" font-family="'Sarabun', sans-serif" font-size="13" font-weight="500">บทที่ 1 รากฐานการโปรแกรมเชิงภาพและสภาพแว...</text>
    <circle cx="30" cy="125" r="3" fill="#10b981" />
    <text x="42" y="130" fill="#f1f5f9" font-family="'Sarabun', sans-serif" font-size="13" font-weight="500">บทที่ 2 ระบบพิกัด การเคลื่อนที่ และการคว...</text>
    <circle cx="30" cy="175" r="3" fill="#10b981" />
    <text x="42" y="180" fill="#f1f5f9" font-family="'Sarabun', sans-serif" font-size="13" font-weight="500">บทที่ 3 การทำงานตามลำดับและเหตุการณ์กระต...</text>
    <circle cx="30" cy="225" r="3" fill="#10b981" />
    <text x="42" y="230" fill="#f1f5f9" font-family="'Sarabun', sans-serif" font-size="13" font-weight="500">บทที่ 4 การวนซ้ำและโครงสร้างควบคุมแบบลูป</text>
    <circle cx="30" cy="275" r="3" fill="#10b981" />
    <text x="42" y="280" fill="#f1f5f9" font-family="'Sarabun', sans-serif" font-size="13" font-weight="500">บทที่ 5 โครงสร้างทางเลือกและเงื่อนไขการต...</text>
    <circle cx="356" cy="75" r="3" fill="#10b981" />
    <text x="368" y="80" fill="#f1f5f9" font-family="'Sarabun', sans-serif" font-size="13" font-weight="500">บทที่ 6 ตัวแปร ตัวดำเนินการคณิตศาสตร์ แล...</text>
    <circle cx="356" cy="125" r="3" fill="#10b981" />
    <text x="368" y="130" fill="#f1f5f9" font-family="'Sarabun', sans-serif" font-size="13" font-weight="500">บทที่ 7 การสร้างฟังก์ชันและบล็อกส่วนตัว</text>
    <circle cx="356" cy="175" r="3" fill="#10b981" />
    <text x="368" y="180" fill="#f1f5f9" font-family="'Sarabun', sans-serif" font-size="13" font-weight="500">บทที่ 8 การตรวจจับการชน เสียง และการสื่อ...</text>
    <circle cx="356" cy="225" r="3" fill="#10b981" />
    <text x="368" y="230" fill="#f1f5f9" font-family="'Sarabun', sans-serif" font-size="13" font-weight="500">บทที่ 9 บล็อกโค้ดดิ้งผสาน AI เบื้องต้น ก...</text>
    <circle cx="356" cy="275" r="3" fill="#10b981" />
    <text x="368" y="280" fill="#f1f5f9" font-family="'Sarabun', sans-serif" font-size="13" font-weight="500">บทที่ 10 โครงงานสร้างสรรค์เกม แอนิเมชัน แ...</text>
  </g>

  <!-- Footer Author & Affiliation Section -->
  <g transform="translate(60, 970)">
    <rect x="0" y="0" width="680" height="90" rx="12" fill="#0f172a" fill-opacity="0.9" stroke="#10b981" stroke-width="1" />
    <text x="30" y="38" fill="#ffffff" font-family="'Sarabun', sans-serif" font-size="18" font-weight="bold">
      ผู้ช่วยศาสตราจารย์ ดร.ชีวะ ทัศนา
    </text>
    <text x="30" y="64" fill="#94a3b8" font-family="'Sarabun', sans-serif" font-size="14">
      สาขาวิชาฟิสิกส์ คณะวิทยาศาสตร์และเทคโนโลยี มหาวิทยาลัยราชภัฏรำไพพรรณี
    </text>
    <rect x="540" y="24" width="115" height="42" rx="6" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-width="1" />
    <text x="597" y="50" text-anchor="middle" fill="#ffffff" font-family="'Inter', sans-serif" font-size="14" font-weight="bold">
      EDITION 2027
    </text>
  </g>
</svg>
