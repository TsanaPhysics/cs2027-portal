<svg class="cover-svg-anim" viewBox="0 0 760 220" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad7" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040714"/>
      <stop offset="50%" stop-color="#0b1329"/>
      <stop offset="100%" stop-color="#02050e"/>
    </linearGradient>
    <linearGradient id="neonGrad7" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <pattern id="grid7" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(56, 189, 248, 0.08)" stroke-width="1"/>
    </pattern>
    <filter id="glow7" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes pulse-core7 {
      0%, 100% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(1.12); opacity: 1; }
    }
    @keyframes spin-geo7 {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes flow-line7 {
      to { stroke-dashoffset: -60; }
    }
    .core-anim7 { transform-origin: 660px 110px; animation: pulse-core7 3s infinite ease-in-out; }
    .spin-anim7 { transform-origin: 660px 110px; animation: spin-geo7 20s linear infinite; }
    .flow-anim7 { stroke-dasharray: 10, 5; animation: flow-line7 1.5s linear infinite; }
  </style>

  <!-- Background -->
  <rect width="760" height="220" fill="url(#bgGrad7)"/>
  <rect width="760" height="220" fill="url(#grid7)"/>

  <!-- Left Cyber Deco Line -->
  <line x1="24" y1="20" x2="24" y2="200" stroke="#3b82f6" stroke-width="4" filter="url(#glow7)"/>
  <circle cx="24" cy="20" r="4" fill="#3b82f6"/>
  <circle cx="24" cy="200" r="4" fill="#3b82f6"/>

  <!-- Badge -->
  <rect x="44" y="24" width="280" height="26" rx="6" fill="rgba(56, 189, 248, 0.12)" stroke="#3b82f6" stroke-width="1"/>
  <text x="56" y="42" font-family="'Chakra Petch', sans-serif" font-size="11" font-weight="700" fill="#3b82f6" letter-spacing="1">
    COMPUTING SCIENCE 1 • CHAPTER 07
  </text>

  <!-- Chapter Title (Thai) -->
  <text x="44" y="86" font-family="'Sarabun', sans-serif" font-size="22" font-weight="700" fill="#ffffff" filter="drop-shadow(0 2px 8px rgba(0,0,0,0.8))">
    บทที่ 7 กิจกรรมอันปลั๊ก 2 การแทนรหัสข้อม
  </text>
  <text x="44" y="116" font-family="'Sarabun', sans-serif" font-size="16" font-weight="600" fill="#94a3b8">
    ูล รหัสไบนารี และพิกเซลภาพ
  </text>

  <!-- Formula Callout Box -->
  <rect x="44" y="142" width="460" height="48" rx="8" fill="rgba(2, 6, 23, 0.85)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1"/>
  <text x="58" y="162" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#3b82f6">
    CORE PRINCIPLE &amp; FORMULA:
  </text>
  <text x="58" y="180" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" fill="#fde047">
    N = \sum_{i=0}^{n-1} b_i 2^i \quad \text{Binary Weight Expansion}
  </text>

  <!-- 3D Geometric Vector Focal at Right -->
  <g class="spin-anim7">
    <polygon points="660,40 730,110 660,180 590,110" fill="none" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="6, 4" opacity="0.6"/>
    <circle cx="660" cy="110" r="55" fill="none" stroke="#38bdf8" stroke-width="1.2" opacity="0.4"/>
  </g>
  <g class="core-anim7">
    <circle cx="660" cy="110" r="32" fill="url(#neonGrad7)" opacity="0.25" filter="url(#glow7)"/>
    <circle cx="660" cy="110" r="18" fill="#3b82f6" opacity="0.8" filter="url(#glow7)"/>
    <circle cx="660" cy="110" r="6" fill="#ffffff"/>
  </g>

  <!-- Flowing Data Stream Lines -->
  <path d="M 504 166 Q 580 166 660 110" fill="none" stroke="#3b82f6" stroke-width="2" class="flow-anim7" opacity="0.7"/>
</svg>
